name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests never produce an APK: they only run unit tests, lint, compile checks and
  # R8 minification so a broken change is caught before the single release build.
  pull_request:
    branches: [main]
  # Manual re-cut of a release from any main commit (or a version tag input).
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional version to publish (e.g. v1.17.0). Defaults to the version in app/build.gradle.kts."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and compile (no APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(ls -1 "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # A PR may read the cache main wrote, but must not poison it for the release job.
          cache-read-only: true

      # One Gradle invocation shares configuration, dependency resolution, up-to-date checks and
      # the build cache, so already-completed work is never redone and the daemon starts once.
      # Compiling androidTest checks the Room migration test still builds; R8 uses the release
      # keep rules so a missing ProGuard rule fails BEFORE merge. No APK is produced here.
      - name: Unit tests, compile, lint and R8 shrink check (no APK)
        run: |
          set +e
          sh ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:compileDebugAndroidTestKotlin \
            testDebugUnitTest \
            :app:lintDebug \
            :app:minifyReleaseWithR8
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "==== LINT ERRORS ===="
            grep -nE ": Error:" "$report" | head -60 || true
          fi
          exit $status

  release:
    name: Build the single signed APK and publish the release
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(ls -1 "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # Version source of truth: tag event > manual dispatch input > app/build.gradle.kts.
      # versionCode auto-increments (never decreases) so every build is a unique upgrade.
      - name: Read and bump version
        id: version
        run: |
          base_v=$(grep -oP 'defaultVersionName = "\K[^"]+' app/build.gradle.kts | head -1)
          base_c=$(grep -oP 'defaultVersionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$base_v" ] || [ -z "$base_c" ]; then echo "version not found" >&2; exit 1; fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version_tag }}" ]; then
            name="${{ inputs.version_tag }}"
            name="${name#v}"
          else
            name="$base_v"
          fi

          code=$((base_c + 1))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Release version: $name ($code)  (gradle base: $base_v / $base_c)"

      # When JARVIS_RELEASE_KEYSTORE_B64 is set it takes precedence over the committed
      # keystore. It is decoded to a temp file, exported for Gradle, and deleted after use.
      - name: Prepare signing keystore (secret override)
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
            echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
            echo "Using decoded keystore from JARVIS_RELEASE_KEYSTORE_B64 secret."
          else
            echo "No JARVIS_RELEASE_KEYSTORE_B64 secret; using committed bundled keystore."
          fi

      # Test gate BEFORE the single APK build: the same checks CI runs on PRs must pass
      # before release packaging is allowed, all inside one Gradle invocation.
      - name: Test gate + build the single release APK (signed, R8)
        run: |
          set +e
          sh ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:compileDebugAndroidTestKotlin \
            testDebugUnitTest \
            :app:lintDebug \
            :app:minifyReleaseWithR8 \
            assembleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.code }} \
            -PversionNameOverride=${{ steps.version.outputs.name }}
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "==== LINT ERRORS ===="
            grep -nE ": Error:" "$report" | head -60 || true
          fi
          exit $status

      - name: Collect release APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/jarvis-v${{ steps.version.outputs.name }}.apk"
          cd out && sha256sum *.apk | tee checksums.txt

      - name: Verify signature, versionCode and pinned certificate
        env:
          EXPECTED_CERT: ${{ secrets.JARVIS_RELEASE_CERT_SHA256 }}
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(ls -1d "$sdk_root"/build-tools/* | sort -V | tail -1)"
          apk="out/jarvis-v${{ steps.version.outputs.name }}.apk"
          echo "== apksigner =="
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "== badging =="
          "$build_tools/aapt" dump badging "$apk" | grep -E "package:|application-label:" | head -5
          code="$("$build_tools/aapt" dump badging "$apk" | grep -oP "versionCode='\K[0-9]+" | head -1)"
          test "$code" = "${{ steps.version.outputs.code }}" || { echo "versionCode mismatch: $code"; exit 1; }
          cert="$("$build_tools/apksigner" verify --print-certs "$apk" | grep -oP 'certificate SHA-256 digest:\s+\K[0-9a-fA-F]+' | head -1 | tr -d ':' | tr 'a-f' 'A-F')"
          expected="${EXPECTED_CERT:-}"
          if [ -z "$expected" ]; then
            expected=$(grep -oP 'bundledCertSha256 = "\K[0-9a-fA-F]+' app/build.gradle.kts)
          fi
          expected=$(echo "$expected" | tr -d ':' | tr 'a-f' 'A-F')
          echo "certificate=$cert expected=$expected"
          if [ -n "$expected" ] && [ "$cert" != "$expected" ]; then
            echo "::error::APK certificate does not match pinned release certificate"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: out/*
          if-no-files-found: error

      # Publishes the HTTPS update manifest next to the APK so the in-app updater can find it
      # at releases/latest/download/update.json. Optional repo variables let a release be made
      # mandatory / set a minimum supported version without touching code:
      #   vars.UPDATE_MANDATORY=true            -> force-lock older installs
      #   vars.UPDATE_MIN_SUPPORTED=<versionCode> -> lock installs below this code
      # Both default to optional (false / 0) so a normal release never blocks anyone.
      - name: Generate update.json (in-app update manifest)
        env:
          UPDATE_MANDATORY: ${{ vars.UPDATE_MANDATORY }}
          UPDATE_MIN_SUPPORTED: ${{ vars.UPDATE_MIN_SUPPORTED }}
        run: |
          name="${{ steps.version.outputs.name }}"
          code="${{ steps.version.outputs.code }}"
          mandatory="${UPDATE_MANDATORY:-false}"
          min_supported="${UPDATE_MIN_SUPPORTED:-0}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${name}/jarvis-v${name}.apk"
          sh scripts/make_update_json.sh "out/jarvis-v${name}.apk" "$code" "$name" "$url" "$min_supported" "$mandatory" "" "out/update.json"
          echo "---- update.json ----"
          cat out/update.json

      - name: Compose release notes (Hinglish guide + SHA-256)
        run: |
          {
            echo "## Jarvis v${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})"
            echo ""
            sed "s/__VERSION__/${{ steps.version.outputs.name }}/g" .github/RELEASE_NOTES_TEMPLATE.md
            echo ""
            echo "### SHA-256 checksums"
            cat out/checksums.txt
          } > out/release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Jarvis v${{ steps.version.outputs.name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: out/release_body.md

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"
