name: Android Build & Release

on:
  push:
    branches: [main]
  # Pull requests never produce an APK: they only run unit tests, lint, compile checks and
  # R8 minification so a broken change is caught before the single release build.
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and compile (no APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(ls -1 "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # A PR may read the cache main wrote, but must not poison it for the release job.
          cache-read-only: true

      # One Gradle invocation shares configuration, dependency resolution, up-to-date checks and
      # the build cache, so already-completed work is never redone and the daemon starts once.
      # Compiling androidTest checks the Room migration test still builds; R8 uses the release
      # keep rules so a missing ProGuard rule fails BEFORE merge. No APK is produced here.
      - name: Unit tests, compile, lint and R8 shrink check (no APK)
        run: |
          set +e
          sh ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :app:compileDebugAndroidTestKotlin \
            testDebugUnitTest \
            :app:lintDebug \
            :app:minifyReleaseWithR8
          status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "==== LINT ERRORS ===="
            grep -nE ": Error:" "$report" | head -60 || true
          fi
          exit $status

  release:
    name: Build the single signed APK and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(ls -1 "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "sdkmanager not found under $sdk_root" >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Read version
        id: version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          c=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          if [ -z "$v" ] || [ -z "$c" ]; then echo "version not found" >&2; exit 1; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$c" >> "$GITHUB_OUTPUT"
          echo "Release version: $v ($c)"

      # The only APK build for this release. Signed with the committed stable keystore
      # (or JARVIS_RELEASE_* secrets when present) and minified with R8.
      - name: Build the single release APK (signed, R8)
        run: sh ./gradlew --no-daemon assembleRelease

      - name: Collect release APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/jarvis-v${{ steps.version.outputs.name }}.apk"
          cd out && sha256sum *.apk | tee checksums.txt

      - name: Verify signature and versionCode
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(ls -1d "$sdk_root"/build-tools/* | sort -V | tail -1)"
          apk="out/jarvis-v${{ steps.version.outputs.name }}.apk"
          echo "== apksigner =="
          "$build_tools/apksigner" verify --print-certs "$apk"
          echo "== badging =="
          "$build_tools/aapt" dump badging "$apk" | grep -E "package:|application-label:" | head -5
          code="$("$build_tools/aapt" dump badging "$apk" | grep -oP "versionCode='\K[0-9]+" | head -1)"
          test "$code" = "${{ steps.version.outputs.code }}" || { echo "versionCode mismatch: $code"; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: out/*
          if-no-files-found: error

      # Publishes the HTTPS update manifest next to the APK so the in-app updater can find it
      # at releases/latest/download/update.json. Optional repo variables let a release be made
      # mandatory / set a minimum supported version without touching code:
      #   vars.UPDATE_MANDATORY=true            -> force-lock older installs
      #   vars.UPDATE_MIN_SUPPORTED=<versionCode> -> lock installs below this code
      # Both default to optional (false / 0) so a normal release never blocks anyone.
      - name: Generate update.json (in-app update manifest)
        env:
          UPDATE_MANDATORY: ${{ vars.UPDATE_MANDATORY }}
          UPDATE_MIN_SUPPORTED: ${{ vars.UPDATE_MIN_SUPPORTED }}
        run: |
          name="${{ steps.version.outputs.name }}"
          code="${{ steps.version.outputs.code }}"
          mandatory="${UPDATE_MANDATORY:-false}"
          min_supported="${UPDATE_MIN_SUPPORTED:-0}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${name}/jarvis-v${name}.apk"
          sh scripts/make_update_json.sh "out/jarvis-v${name}.apk" "$code" "$name" "$url" "$min_supported" "$mandatory" "" "out/update.json"
          echo "---- update.json ----"
          cat out/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Jarvis v${{ steps.version.outputs.name }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Jarvis v${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            ### In-app auto update (force update)
            - App ke andar hi check, download, verify aur install — GitHub Release ke `update.json` se (HTTPS only).
            - Optional update par "Later" milta hai; mandatory par full-screen block (wake/orb/chat/automation band).
            - Emergency SOS ("Code Red"), call pick/cut aur guard phrases force-update me bhi kaam karte rahenge.
            - Install se pehle SHA-256 + package + signer verify; mismatch par file delete.
            - Root/Shizuku silent install (agar available) warna standard installer.

            ### Wake word — faster, more stable, better accuracy
            - Wake hit ab audio thread par nahi, alag callback thread par (mic read loop block nahi hota).
            - Fixed 220ms handoff hataya (event-driven); VAD peak window 1.2s -> 0.5s; standby par noise filter; sensitivity re-tune.

            > Note: jo build pehle se installed hai usme ye update feature nahi hai, isliye **ye build (v${{ steps.version.outputs.name }}) ek baar manually install karna padega**. Uske baad har naya release in-app update ho jayega.