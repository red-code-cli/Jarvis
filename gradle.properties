# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin runs in its own daemon; keep both under the device memory budget.
kotlin.daemon.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=320m

# Performance optimizations
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kapt.incremental.apt=true

# Advanced caching: reuse the configuration phase on repeat builds instead of recomputing it.
# "problems=warn" keeps the build working even if a plugin task is not configuration-cache
# compatible; Gradle then just skips caching for it rather than failing.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
